# A fixed project name, so the container and volume keep their names whatever the folder is called.
name: pet-helper

services:
  db:
    build: ./docker/postgres
    image: pet-helper-postgres:17
    environment:
      POSTGRES_USER: pet_helper
      POSTGRES_PASSWORD: pet_helper
      POSTGRES_DB: pet_helper
    ports:
      # 5432 is often taken on dev machines, and Ferre Mall uses 5433.
      - '5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pet_helper -d pet_helper']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
