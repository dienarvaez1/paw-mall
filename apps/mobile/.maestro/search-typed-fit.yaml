# Typed text that isn't a place's name, sent with the search key, fits the radius too: "Paw
# Tlaxcala" finds nothing within 5 km and the vet in Tlaxcala about 110 km away, so the radius
# opens out to 160 km and lists it (owner's rule, 2026-10-13).
appId: ${APP_ID || 'dev.pawmall.app'}
---
- runFlow: common/launch.yaml
- tapOn:
    id: mode-list
- tapOn:
    id: search-input
- inputText: Paw Tlaxcala
- pressKey: Enter
- extendedWaitUntil:
    visible: Veterinaria Paw Tlaxcala.*
    timeout: 20000
- assertVisible: '(.*\D)?160 km.*'
- assertNotVisible: Como nombre de negocio|As a business name
