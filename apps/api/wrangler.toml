name = "paw-mall-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# postgres.js needs Node's net/tls APIs.
compatibility_flags = ["nodejs_compat"]
# Development only: no deploys and no cloud resources until the owner decides (docs/PLAN.md).
workers_dev = false
preview_urls = false

[vars]
# The Docker DB from `pnpm db:up`. A deployed Worker would use Hyperdrive instead.
DATABASE_URL = "postgres://paw:paw@localhost:5434/paw_mall"
# "Ver horario" from Google, kept free: paid detail requests per month (Google gives 1,000 free)
# and lookups per user per day. The key itself is a secret: GOOGLE_PLACES_API_KEY in .dev.vars
# locally (see docs/GOOGLE-PLACES.md); without it the feature says hours are unavailable.
GOOGLE_MONTHLY_LIMIT = "950"
GOOGLE_DAILY_LOOKUPS = "5"
