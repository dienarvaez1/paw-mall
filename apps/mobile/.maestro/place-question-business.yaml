# "Tlaxcala" typed and sent with the search key, answered as a business name: only businesses
# called that, around the user. "Mi ubicación" is off while the question shows, on after.
appId: dev.pawmall.app
---
- runFlow: common/launch.yaml
- tapOn:
    id: mode-list
- tapOn:
    id: search-input
- inputText: Tlaxcala
# Not picked from the suggestions: the search key on a place's name asks how to read it.
- pressKey: Enter
- extendedWaitUntil:
    visible: Como nombre de negocio|As a business name
    timeout: 20000
# The question turns "Mi ubicación" off, and Cancel leaves it off.
- tapOn: Cancelar|Cancel
- assertVisible:
    id: near-me
    selected: false
# Asked again and answered "as a business name": back on.
- tapOn:
    id: search-input
- pressKey: Enter
- extendedWaitUntil:
    visible: Como nombre de negocio|As a business name
    timeout: 20000
- tapOn: Como nombre de negocio|As a business name
- assertVisible:
    id: near-me
    selected: true
- extendedWaitUntil:
    visible: Mascotas Tlaxcala
    timeout: 20000
- assertNotVisible: Veterinaria Paw Tlaxcala
