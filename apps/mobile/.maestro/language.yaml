# The globe in the search box switches the whole app between Spanish and English.
appId: ${APP_ID || 'dev.pethelper.app'}
---
- runFlow: common/launch.yaml
- assertVisible: Explorar
- tapOn:
    id: language-toggle
- extendedWaitUntil:
    visible: Explore
    timeout: 5000
- assertVisible: .*Favorites.*
- tapOn:
    id: language-toggle
- extendedWaitUntil:
    visible: Explorar
    timeout: 5000
