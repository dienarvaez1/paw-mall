# Save a place from its page and find it in Favoritos; take it out again.
appId: ${APP_ID || 'dev.pawmall.app'}
---
- runFlow: common/launch.yaml
- tapOn:
    id: mode-list
- tapOn: Veterinaria Paw Centro.*
- extendedWaitUntil:
    visible:
      id: place-name
      text: Veterinaria Paw Centro.*
    timeout: 15000
- tapOn:
    id: favorite-button
- runFlow: common/back.yaml
- tapOn:
    id: tab-favorites
- assertVisible: Veterinaria Paw Centro.*
- tapOn: Veterinaria Paw Centro.*
- tapOn:
    id: favorite-button
- runFlow: common/back.yaml
- assertVisible: Aún no tienes favoritos.|You have no favorites yet.
