# Fresh start on the fixed test data (docs/TESTING-E2E.md), with the user at the Zócalo. Locally:
# the development build, opened on the e2e Metro (port 8084), which points it at the e2e API
# (port 8788). With BUNDLED=true (CI): a release build with the code and the e2e API's address
# built in, so there is no development server or menu to go through. With IOS=true and
# APP_ID=host.exp.Exponent: Expo Go on the iOS simulator, opened on the iOS e2e Metro (port 8085).
appId: ${APP_ID || 'dev.pethelper.app'}
---
# LAT / LNG: another spot for a flow that needs one (default: the Zócalo).
- setLocation:
    latitude: ${LAT || 19.4326}
    longitude: ${LNG || -99.1332}
- launchApp:
    clearState: true
    permissions:
      # iOS takes always / inuse / never; Android allow / deny.
      location: "${IOS === 'true' ? 'inuse' : 'allow'}"
- runFlow:
    when:
      true: ${IOS === 'true'}
    commands:
      # The simulator reaches the Mac at 127.0.0.1.
      - openLink: exp://127.0.0.1:8085
      - tapOn:
          text: Open
          optional: true
      # Expo Go's developer-menu introduction shows over the app on a fresh start, once the bundle
      # has loaded.
      - extendedWaitUntil:
          visible: Continue
          timeout: 90000
          optional: true
      - tapOn:
          text: Continue
          optional: true
      # Then the menu itself stays open as a sheet: swipe it down.
      - runFlow:
          when:
            visible: Go home
          commands:
            - swipe:
                start: 50%, 50%
                end: 50%, 98%
                duration: 300
- runFlow:
    when:
      true: ${BUNDLED !== 'true' && IOS !== 'true'}
    commands:
      # 10.0.2.2 is the Mac as the emulator sees it.
      - extendedWaitUntil:
          visible: DEVELOPMENT SERVERS|Development servers
          timeout: 30000
      # Loading the bundle can stall after a clean install; open it again if it does.
      - retry:
          maxRetries: 2
          commands:
            - openLink: exp+pet-helper://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8084
            # A fresh install shows the dev menu's welcome over the app (it hides the search box),
            # then the menu itself: both are closed below.
            - extendedWaitUntil:
                visible: Continue|Lista|List
                timeout: 90000
      - tapOn:
          text: Continue
          optional: true
      - runFlow:
          when:
            visible: Go home
          commands:
            - back
# A fresh start shows the disclaimer (Phase 21): accepted here, unless the flow tests it
# (DISCLAIMER=keep, disclaimer.yaml).
- extendedWaitUntil:
    visible:
      id: disclaimer-accept
    timeout: 60000
- runFlow:
    when:
      true: ${DISCLAIMER !== 'keep'}
    commands:
      - tapOn:
          id: disclaimer-accept
      - extendedWaitUntil:
          visible:
            id: search-input
          timeout: 30000
