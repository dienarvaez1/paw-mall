# Moving the map by hand turns "Mi ubicación" off and searches there; the button comes back to the
# user at the smallest radius (5 km).
appId: dev.pawmall.app
---
- runFlow: common/launch.yaml
- extendedWaitUntil:
    visible: 6 lugares a menos de 5 km.*|6 places within 5 km.*
    timeout: 30000
- repeat:
    times: 3
    commands:
      - swipe:
          start: 80%, 60%
          end: 10%, 60%
- extendedWaitUntil:
    visible:
      id: near-me
      selected: false
    timeout: 15000
- tapOn:
    id: near-me
- extendedWaitUntil:
    visible: 6 lugares a menos de 5 km.*|6 places within 5 km.*
    timeout: 30000
- assertVisible:
    id: near-me
    selected: true
