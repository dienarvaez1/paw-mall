# The owner's claim form says what's missing, then sends.
appId: ${APP_ID || 'dev.pawmall.app'}
---
- runFlow: common/launch.yaml
- tapOn:
    id: mode-list
- scrollUntilVisible:
    element: Tienda de Mascotas Paw.*
    timeout: 20000
- tapOn: Tienda de Mascotas Paw.*
- scrollUntilVisible:
    element: ¿Eres el dueño de este negocio\?|Do you own this business\?
    timeout: 20000
- tapOn: ¿Eres el dueño de este negocio\?|Do you own this business\?
- scrollUntilVisible:
    element:
      id: claim-submit
    timeout: 20000
- tapOn:
    id: claim-submit
- assertVisible: Revisa los datos.*|Check the details.*
- scrollUntilVisible:
    element:
      id: claim-phone
    direction: UP
    timeout: 20000
- tapOn:
    id: claim-phone
- inputText: "5512345678"
- runFlow: common/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: claim-contact-name
    timeout: 20000
- tapOn:
    id: claim-contact-name
- inputText: Prueba E2E
- runFlow: common/hide-keyboard.yaml
- tapOn:
    id: claim-contact
- inputText: prueba@example.com
- runFlow: common/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: claim-consent
    timeout: 20000
- tapOn:
    id: claim-consent
- scrollUntilVisible:
    element:
      id: claim-submit
    timeout: 20000
- tapOn:
    id: claim-submit
- extendedWaitUntil:
    visible: Recibimos tu solicitud.*|We received your request.*
    timeout: 20000
