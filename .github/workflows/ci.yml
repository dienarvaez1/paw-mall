# Lint, typecheck and unit tests on every pull request and on main. The tests need Postgres with
# PostGIS, started the same way as on a dev machine (`pnpm db:up`, port 5434).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres + PostGIS
        run: pnpm db:up
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
