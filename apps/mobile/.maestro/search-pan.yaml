# A picked place holds the search until the map is moved by hand: the search lets go of it, the
# box empties and the search follows the map, with "Mi ubicación" still off (owner's rule,
# 2026-10-14).
appId: ${APP_ID || 'dev.pawmall.app'}
---
- runFlow: common/launch.yaml
- tapOn:
    id: search-input
- inputText: Tlaxcala
- extendedWaitUntil:
    visible:
      id: suggestion-0
    timeout: 20000
- tapOn:
    id: suggestion-0
- extendedWaitUntil:
    visible: .*(de|of) Tlaxcala.*
    timeout: 20000
- repeat:
    times: 2
    commands:
      - swipe:
          start: 80%, 60%
          end: 10%, 60%
- extendedWaitUntil:
    notVisible: .*(de|of) Tlaxcala.*
    timeout: 20000
- assertNotVisible: Tlaxcala
- assertVisible:
    id: near-me
    selected: false
