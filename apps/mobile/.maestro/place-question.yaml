# "Tlaxcala" is a place's name and a business's: the app asks, and nothing searches until the
# answer. As a place: the vets in Tlaxcala, not the store named after it near the user.
appId: dev.pawmall.app
---
- runFlow: common/launch.yaml
- tapOn:
    id: mode-list
- tapOn:
    id: search-input
- inputText: Tlaxcala
- extendedWaitUntil:
    visible: Como lugar|As a place
    timeout: 20000
- tapOn: Como lugar|As a place
- hideKeyboard
- extendedWaitUntil:
    visible: Veterinaria Paw Tlaxcala
    timeout: 20000
- assertNotVisible: Mascotas Tlaxcala
