# Favoritos lists saved places newest first.
appId: ${APP_ID || 'dev.pawmall.app'}
---
- runFlow: common/launch.yaml
- tapOn:
    id: mode-list
- tapOn: Veterinaria Paw Centro.*
- tapOn:
    id: favorite-button
- runFlow: common/back.yaml
- tapOn: Estética Canina Paw.*
- tapOn:
    id: favorite-button
- runFlow: common/back.yaml
- tapOn:
    id: tab-favorites
- extendedWaitUntil:
    visible: Veterinaria Paw Centro.*
    timeout: 15000
- copyTextFrom:
    id: place-row
    index: 0
- assertTrue: ${maestro.copiedText.includes('Estética Canina Paw')}
