# The same text answered as a business name: only businesses called that, around the user.
appId: dev.pawmall.app
---
- runFlow: common/launch.yaml
- tapOn:
    id: mode-list
- tapOn:
    id: search-input
- inputText: Tlaxcala
- extendedWaitUntil:
    visible: Como nombre de negocio|As a business name
    timeout: 20000
- tapOn: Como nombre de negocio|As a business name
- hideKeyboard
- extendedWaitUntil:
    visible: Mascotas Tlaxcala
    timeout: 20000
- assertNotVisible: Veterinaria Paw Tlaxcala
