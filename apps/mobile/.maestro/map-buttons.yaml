# The layers button toggles the satellite map; the compass turns the map north.
appId: ${APP_ID || 'dev.pawmall.app'}
---
- runFlow: common/launch.yaml
- tapOn:
    id: map-layers
- assertVisible:
    id: map-layers
    selected: true
- tapOn:
    id: map-layers
- assertVisible:
    id: map-layers
    selected: false
- tapOn:
    id: map-compass
- assertVisible:
    id: search-input
# The pin button (above the map style) steps the cutoff between pins and clusters: 200 → 300 →
# 50 (owner's rule, 2026-10-14).
- assertVisible:
    id: map-pins
    text: '(Pines hasta|Pins for up to) 200 .*'
- tapOn:
    id: map-pins
- assertVisible:
    id: map-pins
    text: '(Pines hasta|Pins for up to) 300 .*'
- tapOn:
    id: map-pins
- assertVisible:
    id: map-pins
    text: '(Pines hasta|Pins for up to) 50 .*'
